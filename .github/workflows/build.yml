name: 构建 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 编译 Debug APK
        run: |
          export GRADLE_USER_HOME="$RUNNER_TEMP/gradle-home"
          export ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
          gradle wrapper --gradle-version 8.9 --no-daemon --console=plain
          ./gradlew :app:assembleDebug --no-daemon --console=plain --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
